<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asesor de Repuestos</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2b2f37;
    --text: #e7e8ea;
    --muted: #8b909a;
    --accent: #ff7a30;
    --ok: #4caf7d;
    --burbuja-user: #2b3a4a;
    --burbuja-bot: #1c1f25;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    margin: 0;
    font-size: 1.1rem;
  }
  header p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .tabs button.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* --- Vista Chat --- */
  #vistaChat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 85%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  .burbuja {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.92rem;
    white-space: pre-wrap;
    line-height: 1.45;
  }
  .msg.user .burbuja {
    background: var(--burbuja-user);
    border-bottom-right-radius: 3px;
  }
  .msg.bot .burbuja {
    background: var(--burbuja-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.bot.cargando .burbuja { color: var(--muted); font-style: italic; }
  .sugeridos { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sugerido {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.82rem;
    background: #12141850;
  }
  .sugerido .sku { font-family: ui-monospace, monospace; color: var(--accent); }

  form#formChat {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  form#formChat textarea {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    background: #12141850;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  form#formChat textarea:focus { outline: none; border-color: var(--accent); }
  form#formChat button {
    padding: 0 18px;
    background: var(--accent);
    color: #1a1200;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  form#formChat button:disabled { opacity: 0.5; cursor: default; }

  /* --- Vista Agregar --- */
  #vistaAgregar { display: none; padding: 20px; overflow-y: auto; }
  #vistaAgregar label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  #vistaAgregar input, #vistaAgregar textarea {
    width: 100%;
    padding: 9px 10px;
    background: #12141850;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  #vistaAgregar input:focus, #vistaAgregar textarea:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #vistaAgregar button {
    margin-top: 18px;
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #1a1200;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  .status {
    margin-top: 12px;
    font-size: 0.85rem;
    padding: 8px 10px;
    border-radius: 6px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #17301f; color: var(--ok); }
  .status.err { background: #35201d; color: #ff8b7a; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Asesor de Repuestos</h1>
      <p>Pregunta como le hablarías a un vendedor</p>
    </div>
    <div class="tabs">
      <button id="tabChat" class="active">Consultar</button>
      <button id="tabAgregar">Agregar repuesto</button>
    </div>
  </header>

  <!-- Vista Chat -->
  <div id="vistaChat">
    <div id="mensajes">
      <div class="msg bot">
        <div class="burbuja">¡Hola! Cuéntame qué necesitas — por ejemplo: "cauchos para que no suene la puerta del corolla 2015".</div>
      </div>
    </div>
    <form id="formChat">
      <textarea id="inputConsulta" rows="1" placeholder="Escribe tu consulta..." required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <!-- Vista Agregar -->
  <div id="vistaAgregar">
    <form id="formAgregar">
      <label>SKU</label>
      <input name="sku" required placeholder="COR-2015-PTA-01">

      <label>Nombre</label>
      <input name="nombre" required placeholder="Caucho de puerta">

      <div class="row2">
        <div>
          <label>Marca</label>
          <input name="marca" placeholder="Toyota">
        </div>
        <div>
          <label>Modelo compatible</label>
          <input name="modelo_compatible" placeholder="Corolla">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Año desde</label>
          <input name="anio_desde" type="number" placeholder="2014">
        </div>
        <div>
          <label>Año hasta</label>
          <input name="anio_hasta" type="number" placeholder="2016">
        </div>
      </div>

      <label>Cilindraje</label>
      <input name="cilindraje" placeholder="1.8">

      <label>Descripción</label>
      <textarea name="descripcion" rows="2" placeholder="Elimina ruido de puerta"></textarea>

      <div class="row2">
        <div>
          <label>Precio</label>
          <input name="precio" type="number" placeholder="45000">
        </div>
        <div>
          <label>Stock</label>
          <input name="stock" type="number" placeholder="10">
        </div>
      </div>

      <button type="submit">Guardar e indexar</button>
      <div class="status" id="statusAgregar"></div>
    </form>
  </div>
</div>

<script>
  // Como el frontend lo sirve el mismo Spring Boot, las rutas son relativas: sin CORS, sin URL base.

  // --- Tabs ---
  const tabChat = document.getElementById('tabChat');
  const tabAgregar = document.getElementById('tabAgregar');
  const vistaChat = document.getElementById('vistaChat');
  const vistaAgregar = document.getElementById('vistaAgregar');

  tabChat.addEventListener('click', () => {
    tabChat.classList.add('active');
    tabAgregar.classList.remove('active');
    vistaChat.style.display = 'flex';
    vistaAgregar.style.display = 'none';
  });
  tabAgregar.addEventListener('click', () => {
    tabAgregar.classList.add('active');
    tabChat.classList.remove('active');
    vistaAgregar.style.display = 'block';
    vistaChat.style.display = 'none';
  });

  // --- Chat ---
  const mensajesEl = document.getElementById('mensajes');
  const formChat = document.getElementById('formChat');
  const inputConsulta = document.getElementById('inputConsulta');

  function agregarMensaje(tipo, texto, sugeridos) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;

    const burbuja = document.createElement('div');
    burbuja.className = 'burbuja';
    burbuja.textContent = texto;
    div.appendChild(burbuja);

    if (sugeridos && sugeridos.length) {
      const cont = document.createElement('div');
      cont.className = 'sugeridos';
      cont.innerHTML = sugeridos.map(r => `
        <div class="sugerido">
          <span class="sku">${r.sku}</span> — ${r.nombre} (${r.marca})<br>
          $${r.precio} · stock: ${r.stock}
        </div>
      `).join('');
      div.appendChild(cont);
    }

    mensajesEl.appendChild(div);
    mensajesEl.scrollTop = mensajesEl.scrollHeight;
    return div;
  }

  formChat.addEventListener('submit', async (e) => {
    e.preventDefault();
    const consulta = inputConsulta.value.trim();
    if (!consulta) return;

    agregarMensaje('user', consulta);
    inputConsulta.value = '';

    const cargando = agregarMensaje('bot', 'Buscando en el catálogo...');
    cargando.classList.add('cargando');

    formChat.querySelector('button').disabled = true;
    try {
      const res = await fetch('/repuestos/buscar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ consulta })
      });
      const data = await res.json();
      cargando.remove();
      if (!res.ok) throw new Error(data.error || 'Error al buscar');
      agregarMensaje('bot', data.respuesta || 'No encontré una respuesta.', data.repuestos_sugeridos);
    } catch (err) {
      cargando.remove();
      agregarMensaje('bot', 'Ocurrió un error: ' + err.message);
    } finally {
      formChat.querySelector('button').disabled = false;
    }
  });

  // Enviar con Enter (Shift+Enter para salto de línea)
  inputConsulta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formChat.requestSubmit();
    }
  });

  // --- Agregar repuesto ---
  document.getElementById('formAgregar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const statusEl = document.getElementById('statusAgregar');
    const data = Object.fromEntries(new FormData(e.target).entries());

    ['anio_desde', 'anio_hasta', 'precio', 'stock'].forEach(k => {
      if (data[k] !== '') data[k] = Number(data[k]);
    });

    btn.disabled = true;
    try {
      const res = await fetch('/repuestos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Error al guardar');
      statusEl.textContent = 'Repuesto guardado e indexado: ' + json.sku;
      statusEl.className = 'status show ok';
      e.target.reset();
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.className = 'status show err';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
